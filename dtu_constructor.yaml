# Shortcuts for generalized output
dtu_python: &dtu_python python 3.14.*
dtu_numpy: &dtu_numpy numpy >=2.1
dtu_matplotlib: &dtu_matplotlib matplotlib >=3.8
dtu_spb: &dtu_spb sympy_plot_backends >=4

dtu_jinja_variables:
  # We have to use the DTU signature, E=efterår, F=forår
  dtu_semester: E
  dtu_year: 2026

name: Miniforge3
company: "DTU Python Installation Support"
initialize_by_default: True

user_requested_specs:
  - *dtu_python
  - *dtu_numpy
  - *dtu_matplotlib
  - *dtu_spb
  - scikit-learn
  - pandas
  - scipy
  - statsmodels
  - uncertainties

specs:
  - *dtu_python
  - *dtu_numpy
  - *dtu_matplotlib
  - scikit-learn
  - pandas
  - scipy
  - statsmodels
  - uncertainties

# We have access to these variables:
# - dtu_year
# - dtu_semester
extra_envs:
  01001-{{ dtu_semester }}{{ dtu_year[2:] }}:
    channels:
      - conda-forge
    specs:
      - *dtu_python
      - *dtu_numpy
      - *dtu_matplotlib
      - *dtu_spb
      - scikit-learn
      - scipy
      - pandas
  02002-{{ dtu_semester }}{{ dtu_year[2:] }}:
    channels:
      - conda-forge
    specs:
      - *dtu_python
      - *dtu_numpy
      - *dtu_matplotlib
  02402-{{ dtu_semester }}{{ dtu_year[2:] }}:
    channels:
      - conda-forge
    specs:
      - *dtu_python
      - *dtu_numpy
      - *dtu_matplotlib
      - pandas
      - scipy
      - statsmodels
  10060-{{ dtu_semester }}{{ dtu_year[2:] }}:
    channels:
      - conda-forge
    specs:
      - *dtu_python
      - *dtu_numpy
      - *dtu_matplotlib
      - pandas
      - scipy
      - uncertainties
