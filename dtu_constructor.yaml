# Shortcuts for generalized output
dtu_python: &dtu_python python 3.14.*
dtu_numpy: &dtu_numpy numpy >=2.1
dtu_matplotlib: &dtu_matplotlib matplotlib >=3.8
dtu_spb: &dtu_spb sympy_plot_backends >=4

dtu_jinja_variables:
  # We have to use the DTU signature, E=efterår, F=forår
  dtu_semester: E
  dtu_year: 2026

name: Miniforge3
company: "DTU Python Installation Support"
initialize_by_default: True

user_requested_specs:
  - *dtu_python
  - *dtu_numpy
  - *dtu_matplotlib
  - *dtu_spb
  - jupyter
  - ipykernel
  - scikit-learn
  - pandas
  - scipy
  - statsmodels
  - uncertainties

specs:
  - *dtu_python
  - *dtu_numpy
  - *dtu_matplotlib
  - jupyter
  - ipykernel
  - scikit-learn
  - pandas
  - scipy
  - statsmodels
  - uncertainties

post_install: dtu_post_install.sh  # [unix]

# Freeze base environment to prevent students from modifying it (CEP-22)
# Requires constructor>=3.13.0
freeze_base:
  conda:
    message: |
      This base environment is frozen and cannot be modified.

      To control packages please create a new environment:

        conda create -n myproject python=3.14 <your-packages>
        conda activate myproject

      For more information, have a look here:
      https://pythonsupport.dtu.dk/learn-more/packages-and-environments/environments.html

# We have access to these variables:
# - dtu_year
# - dtu_semester
extra_envs:
  01001-{{ dtu_semester }}{{ dtu_year[2:] }}:
    channels:
      - conda-forge
    specs:
      - *dtu_python
      - *dtu_numpy
      - *dtu_matplotlib
      - *dtu_spb
      - jupyter
      - ipykernel
      - scikit-learn
      - scipy
      - pandas
  02002-{{ dtu_semester }}{{ dtu_year[2:] }}:
    channels:
      - conda-forge
    specs:
      - *dtu_python
      - *dtu_numpy
      - *dtu_matplotlib
      - jupyter
      - ipykernel
  02402-{{ dtu_semester }}{{ dtu_year[2:] }}:
    channels:
      - conda-forge
    specs:
      - *dtu_python
      - *dtu_numpy
      - *dtu_matplotlib
      - pandas
      - scipy
      - statsmodels
      - jupyter
      - ipykernel
  10060-{{ dtu_semester }}{{ dtu_year[2:] }}:
    channels:
      - conda-forge
    specs:
      - *dtu_python
      - *dtu_numpy
      - *dtu_matplotlib
      - pandas
      - scipy
      - uncertainties
      - jupyter
      - ipykernel
