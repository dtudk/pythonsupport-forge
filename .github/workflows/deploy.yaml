---
name: deploy DTU releases

# Change this to whatever you want
on:
  push:
    name: Push done
  pull_request:
    name: Pull request created
  workflow_dispatch:
    name: User requested
    inputs:
      release:
        description: 'Force-build?'
        type: boolean
        required: false
        default: false

jobs:

  build:
    # We need it somewhere else than workflows to disable auto-runs.
    uses: ./.github/ci.yml

  deploy:
    name: Publish on pythonsupport.dtu.dk
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      # do not provide name, then it downloads all artifacts
      - uses: actions/download-artifact@v8

      - name: Prepare directory and files
        shell: bash -el {0}
        run: |
          ls -l
          PS_DTU_REF="${GITHUB_REF##*/}"
          PS_DTU_YEAR="${PS_DTU_REF%%\.*}"
          echo "PS_DTU_REF=$PS_DTU_REF" >> $GITHUB_ENV
          echo "PS_DTU_YEAR=$PS_DTU_YEAR" >> $GITHUB_ENV
          # Now move all builds to proper version
          for d in M*forge*/ ; do
            pushd $d
            ls -l
            for f in M*forge* ; do
              ext=${f##*\.}
              mv $f ../${f//\.${ext}/}-$PS_DTU_REF.${ext}
            done
            popd
            rm -rf $d/
          done
          ls -l

      - name: Upload release pythonsupport.dtu.dk
        uses: Burnett01/rsync-deployments@v8
        with:
          switches: -vr
          path: M*forge*-$PS_DTU_REF.*
          remote_path: ${{ secrets.DEPLOY_PATH }}/ps-files/installer/${PS_DTU_YEAR}/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_KEY_PRIVATE }}
